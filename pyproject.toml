[project]
name = "deconvolution"
version = "0.1.0"
description = "Microscope deconvolution: PSF modelling, gradient-consensus, and semi-blind Zernike fitting"
readme = "README.md"
authors = [
    { name = "Nico Stuurman", email = "oincst@gmail.com" }
]
requires-python = ">=3.12, <3.14"
dependencies = [
    "torch",
    "numpy",
    "scipy",
    "matplotlib",
    "tifffile>=2026.10.15",
]

# These are run-anywhere scripts (they import each other as siblings), not an
# installed package, so there is no build-system or console-script entry point.
# Run them with, for example:  uv run src/make_airy_psf.py
[tool.uv]
package = false

# On Windows and Linux, get PyTorch built for NVIDIA GPUs (CUDA 13.2; needs an
# NVIDIA driver from the 580 series or newer).  The plain PyPI build is
# CPU-only on Windows.  Macs keep using PyPI, which includes Apple GPU (MPS)
# support.
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

# Test dependencies.  uv installs the "dev" group by default, so `uv run pytest`
# just works.
[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]          # let the tests import the scripts in src/
testpaths = ["tests"]
markers = ["slow: end-to-end tests that take a few seconds (deselect with -m 'not slow')"]
